# Safeguard exercising the Govern security function (new in NIST CSF 2.0 / CIS v8.1)
id: CIS-14.1
title: Establish and Maintain a Security Awareness Program
safeguard_number: "14.1"
description: >-
  Establish and maintain a security awareness program. The purpose of a
