id: CIS-Controls-v8.1
title: CIS Critical Security Controls Version 8.1
version: "8.1"
publication_date: "2025-03-01"
controls:
  - id: CIS-1
    title: Inventory and Control of Enterprise Assets
    control_number: "1"
    overview: >-
      Actively manage (inventory, track, and correct) all enterprise assets
      (end-user devices, network devices, non-computing/IoT devices, and
      servers) connected to the infrastructure physically, virtually, remotely,
      and those within cloud environments, to accurately know the totality of
      assets that need to be monitored and protected within the enterprise.
    why_critical: >-
      Enterprises cannot defend what they do not know they have. Managed
      control of all enterprise assets also plays a critical role in security
      monitoring, incident response, system backup, and recovery.
    procedures_and_tools: >-
      This CIS Control requires both technical and procedural actions, united
      in a process that accounts for, and manages the inventory of, enterprise
      assets and all associated data throughout its life cycle.
    safeguards:
      - id: CIS-1.1
        title: Establish and Maintain Detailed Enterprise Asset Inventory
        safeguard_number: "1.1"
        description: >-
          Establish and maintain an accurate, detailed, and up-to-date
          inventory of all enterprise assets with the potential to store or
          process data. Review and update the inventory of all enterprise
          assets bi-annually, or more frequently.
        asset_type: Devices
        security_function: Identify
        implementation_groups:
          - IG1
          - IG2
          - IG3
      - id: CIS-1.2
        title: Address Unauthorized Assets
        safeguard_number: "1.2"
        description: >-
          Ensure that a process exists to address unauthorized assets on a
          weekly basis. The enterprise may choose to remove the asset from
          the network, deny the asset from connecting remotely, or quarantine
          the asset.
        asset_type: Devices
        security_function: Respond
        implementation_groups:
          - IG1
          - IG2
          - IG3
      - id: CIS-1.3
        title: Utilize an Active Discovery Tool
        safeguard_number: "1.3"
        description: >-
          Utilize an active discovery tool to identify assets connected to the
          enterprise's network. Configure the active discovery tool to execute
          daily, or more frequently.
        asset_type: Devices
        security_function: Detect
        implementation_groups:
          - IG2
          - IG3
      - id: CIS-1.4
        title: Use Dynamic Host Configuration Protocol (DHCP) Logging to Update Enterprise Asset Inventory
        safeguard_number: "1.4"
        description: >-
          Use DHCP logging on all DHCP servers or Internet Protocol (IP)
          address management tools to update the enterprise's asset inventory.
          Review and use logs to update the enterprise's asset inventory
          weekly, or more frequently.
        asset_type: Devices
        security_function: Identify
        implementation_groups:
          - IG2
          - IG3
      - id: CIS-1.5
        title: Use a Passive Asset Discovery Tool
        safeguard_number: "1.5"
        description: >-
          Use a passive discovery tool to identify assets connected to the
          enterprise's network. Review and use scans to update the enterprise's
          asset inventory at least weekly, or more frequently.
        asset_type: Devices
        security_function: Detect
        implementation_groups:
          - IG3
