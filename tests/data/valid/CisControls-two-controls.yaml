# An edition cut down to two Controls and some of their Safeguards, named by
# number alone. The asset classes, security functions and Implementation
# Groups are those CIS's guide gives at v8.1.2; no text of CIS's is here.
cis_version: "8.1.2"
cis_controls:
  - cis_control_id: "1"
    control_safeguards:
      - cis_safeguard_id: "1.1"
        safeguard_asset_class: DEVICES
        safeguard_security_function: IDENTIFY
        safeguard_implementation_groups: [IG1, IG2, IG3]
      - cis_safeguard_id: "1.2"
        safeguard_asset_class: DEVICES
        safeguard_security_function: RESPOND
        safeguard_implementation_groups: [IG1, IG2, IG3]
      - cis_safeguard_id: "1.3"
        safeguard_asset_class: DEVICES
        safeguard_security_function: DETECT
        safeguard_implementation_groups: [IG2, IG3]
  - cis_control_id: "16"
    control_safeguards:
      - cis_safeguard_id: "16.1"
        safeguard_asset_class: DOCUMENTATION
        safeguard_security_function: GOVERN
        safeguard_implementation_groups: [IG2, IG3]
      - cis_safeguard_id: "16.14"
        safeguard_asset_class: SOFTWARE
        safeguard_security_function: PROTECT
        safeguard_implementation_groups: [IG3]
