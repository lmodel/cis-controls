    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
enums:
  ImplementationGroup:
    name: ImplementationGroup
    definition_uri: https://w3id.org/lmodel/cis-controls/ImplementationGroup
    description: "Self-assessed tier of CIS Controls applicability based on an enterprise's\
      \ risk profile and resources. Each IG is cumulative \u2014 IG2 includes IG1,\
      \ IG3 includes both. Introduced in CIS Controls v7.1 as the recommended way\
      \ to prioritize implementation."
    from_schema: https://w3id.org/lmodel/cis-controls
    permissible_values:
      IG1:
        text: IG1
        description: Small to medium-sized enterprise with limited IT and cybersecurity
          expertise to dedicate toward protecting IT assets and personnel. The principal
          concern is to keep the business operational; limited tolerance for downtime;
          data sensitivity is low, principally surrounding employee and financial
          information. Safeguards should be implementable with limited cybersecurity
          expertise and designed to thwart general, non-targeted attacks using COTS
          hardware and software. Also called "Essential Cyber Hygiene."
      IG2:
        text: IG2
        description: Enterprise employing individuals responsible for managing and
          protecting IT infrastructure. Supports multiple departments with differing
          risk profiles based on job function and mission; may have regulatory compliance
          burdens; often stores and processes sensitive client or enterprise information
          and can withstand short interruptions of service. A major concern is loss
          of public confidence if a breach occurs. Safeguards help security teams
          cope with increased operational complexity; some depend on enterprise-grade
          technology and specialized expertise to properly install and configure.
          Includes all IG1 safeguards.
      IG3:
        text: IG3
        description: Enterprise employing security experts that specialize in the
          different facets of cybersecurity (e.g., risk management, penetration testing,
          application security). Assets and data contain sensitive information or
          functions subject to regulatory and compliance oversight; must address availability
          of services and the confidentiality and integrity of sensitive data; successful
          attacks can cause significant harm to the public welfare. Safeguards must
          abate targeted attacks from a sophisticated adversary and reduce the impact
          of zero-day attacks. Includes all IG1 and IG2 safeguards.
  AssetType:
    name: AssetType
    definition_uri: https://w3id.org/lmodel/cis-controls/AssetType
    description: The category of enterprise asset primarily addressed by a Safeguard.
      Aligned with the CIS Controls Asset Classes taxonomy (v8.1, pg. 8). Sub-classes
      exist within each category but Safeguards reference the top-level class only.
    from_schema: https://w3id.org/lmodel/cis-controls
    permissible_values:
      Devices:
        text: Devices
        description: Enterprise assets (data processing and storage assets), end-user
          devices (including portable and mobile devices), servers, Internet of Things
          (IoT) and non-computing devices, network devices, and removable media. Devices
          may exist in physical, virtual, or cloud-based environments and can remotely
          connect to these systems.
      Software:
        text: Software
        description: Sets of data and instructions used to direct a computer to complete
          a specific task. Includes applications, operating systems (with their services,
          libraries, and APIs), and firmware. Both applications and operating systems
          are considered software assets.
      Data:
        text: Data
        description: 'A collection of facts that can be examined, considered, and
          used for decision-making. Although data may be physical, the CIS Controls
          primarily provide protection for digital data stored, transferred, and processed
          by enterprise assets. Sub-classes: sensitive data, log data, and physical
          data.'
      Users:
        text: Users
        description: Employees, third-party vendors, contractors, service providers,
          consultants, or any other person authorized to access an enterprise asset.
          Includes workforce, service providers, and user/administrator/service accounts.
      Network:
        text: Network
        description: A group of interconnected devices that exchange data. A superset
          of network infrastructure (hardware and software providing connectivity
          and communication) and network architecture (the logical and physical design
          of the network).
      Documentation:
        text: Documentation
        description: 'Policies, processes, procedures, plans, diagrams, and other
          written material (physical or digital), such as compliance reports. Examples
          include methods of governance for an enterprise, processes users follow,
          or descriptions of network architecture. Sub-classes: plans, policies, processes,
          and procedures.'
  SecurityFunction:
    name: SecurityFunction
    definition_uri: https://w3id.org/lmodel/cis-controls/SecurityFunction
    description: NIST Cybersecurity Framework 2.0 security function category to which
      a Safeguard is primarily mapped. Values correspond exactly to the six CSF 2.0
      Functions; enum as a whole is a close match for nist_csf_v2:CSFFunction.
    from_schema: https://w3id.org/lmodel/cis-controls
    close_mappings:
    - nist_csf_v2:CSFFunction
    permissible_values:
      Govern:
        text: Govern
        description: Establish and monitor the organization's cybersecurity risk management
          strategy, expectations, and policy.
        meaning: nist_csf_v2:GV
      Identify:
        text: Identify
        description: Develop an organizational understanding of cybersecurity risk
          to systems, people, assets, data, and capabilities.
        meaning: nist_csf_v2:ID
      Protect:
        text: Protect
        description: Develop and implement appropriate safeguards to ensure delivery
          of critical services.
        meaning: nist_csf_v2:PR
      Detect:
        text: Detect
        description: Develop and implement appropriate activities to identify the
          occurrence of a cybersecurity event.
        meaning: nist_csf_v2:DE
      Respond:
        text: Respond
        description: Develop and implement appropriate activities to take action regarding
          a detected cybersecurity incident.
        meaning: nist_csf_v2:RS
      Recover:
        text: Recover
        description: Develop and implement appropriate activities to maintain plans
          for resilience and to restore capabilities impaired by a cybersecurity incident.
        meaning: nist_csf_v2:RC
