name: cis-controls
description: 'LinkML schema for the CIS Critical Security Controls (CIS Controls)
  Version 8.1.2

  (March 2025). Models the 18 Controls and their Safeguards, including asset types,

  security functions, and Implementation Groups as defined by the Center for Internet

  Security. Source document: CIS Controls v8.1.2 (March 2025),

  licensed CC BY-NC-ND 4.0 (https://creativecommons.org/licenses/by-nc-nd/4.0/).'
title: CIS Controls
see_also:
- https://www.cisecurity.org/controls/
- https://lmodel.github.io/cis-controls
id: https://w3id.org/lmodel/cis-controls
version: 8.1.2
imports:
- linkml:types
license: Apache-2.0
prefixes:
  cis_controls:
    prefix_prefix: cis_controls
    prefix_reference: https://w3id.org/lmodel/cis-controls/
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  schema:
    prefix_prefix: schema
    prefix_reference: http://schema.org/
  dct:
    prefix_prefix: dct
    prefix_reference: http://purl.org/dc/terms/
  skos:
    prefix_prefix: skos
    prefix_reference: http://www.w3.org/2004/02/skos/core#
  rdfs:
    prefix_prefix: rdfs
    prefix_reference: http://www.w3.org/2000/01/rdf-schema#
  xsd:
    prefix_prefix: xsd
    prefix_reference: http://www.w3.org/2001/XMLSchema#
  nist_csf_v2:
    prefix_prefix: nist_csf_v2
    prefix_reference: https://w3id.org/lmodel/nist-csf-v2/
  iso27001:
    prefix_prefix: iso27001
    prefix_reference: https://w3id.org/lmodel/iso27001/
  WIKIDATA:
    prefix_prefix: WIKIDATA
    prefix_reference: https://www.wikidata.org/wiki/
default_prefix: cis_controls
default_range: string
subsets:
  essential_cyber_hygiene:
    name: essential_cyber_hygiene
    definition_uri: https://w3id.org/lmodel/cis-controls/EssentialCyberHygiene
    description: Profile containing Safeguards where implementation_groups includes
      IG1. The minimum set every enterprise should implement ("Essential Cyber Hygiene").
      56 safeguards across all 18 Controls.
    from_schema: https://w3id.org/lmodel/cis-controls
  ig2_controls:
    name: ig2_controls
    definition_uri: https://w3id.org/lmodel/cis-controls/Ig2Controls
    description: Profile containing Safeguards where implementation_groups includes
      IG2 (a superset of essential_cyber_hygiene). For organizations managing sensitive
      data with dedicated security staff.
    from_schema: https://w3id.org/lmodel/cis-controls
  ig3_controls:
    name: ig3_controls
    definition_uri: https://w3id.org/lmodel/cis-controls/Ig3Controls
    description: Profile containing Safeguards where implementation_groups includes
      IG3 (a superset of ig2_controls). For high-risk profiles with specialist security
      expertise. All 153 safeguards across 18 Controls.
    from_schema: https://w3id.org/lmodel/cis-controls
types:
  ControlId:
    name: ControlId
    definition_uri: https://w3id.org/lmodel/cis-controls/ControlId
    description: Identifier for a CIS Control (e.g. "1", "18").
    from_schema: https://w3id.org/lmodel/cis-controls
    base: str
    uri: xsd:string
    pattern: ^([1-9]|1[0-8])$
  SafeguardId:
    name: SafeguardId
    definition_uri: https://w3id.org/lmodel/cis-controls/SafeguardId
    description: Identifier for a CIS Safeguard in the form <control>.<safeguard>
      (e.g. "1.1", "16.14").
    from_schema: https://w3id.org/lmodel/cis-controls
    base: str
    uri: xsd:string
    pattern: ^([1-9]|1[0-8])\.[0-9]+$
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string.   If you are authoring schemas in LinkML YAML, the type is
      referenced with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
