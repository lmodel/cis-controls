# metamodel_version: 1.12.0
# version: 8.1.2
enum CisAssetClass
  {
    DEVICES
    SOFTWARE
    DATA
    USERS
    NETWORK
    DOCUMENTATION
  }

enum CisImplementationGroup
  {
    IG1
    IG2
    IG3
  }

enum CisSecurityFunction
  {
    GOVERN
    IDENTIFY
    PROTECT
    DETECT
    RESPOND
    RECOVER
  }

type CisControl
  {
    cisControlId: CisControlIdentifier!
    title: String
    description: String
    controlSafeguards: [CisSafeguard]
  }

type CisControls
  {
    cisVersion: String!
    cisControls: [CisControl]!
  }

type CisSafeguard
  {
    cisSafeguardId: CisSafeguardIdentifier!
    title: String
    description: String
    safeguardAssetClass: CisAssetClass!
    safeguardSecurityFunction: CisSecurityFunction!
    safeguardImplementationGroups: [CisImplementationGroup]!
  }
