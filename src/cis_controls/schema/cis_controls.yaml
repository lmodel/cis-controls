---
id: https://w3id.org/lmodel/cis-controls
name: cis-controls
title: CIS Controls
description: |-
  LinkML schema for the CIS Critical Security Controls (CIS Controls) Version 8.1.2
  (March 2025). Models the 18 Controls and their Safeguards, including asset types,
  security functions, and Implementation Groups as defined by the Center for Internet
  Security. Source document: CIS Controls v8.1.2 (March 2025),
  licensed CC BY-NC-ND 4.0 (https://creativecommons.org/licenses/by-nc-nd/4.0/).
license: Apache-2.0
see_also:
  - https://www.cisecurity.org/controls/
  - https://lmodel.github.io/cis-controls
version: 8.1.2

prefixes:
  cis_controls: "https://w3id.org/lmodel/cis-controls/"
  linkml:       "https://w3id.org/linkml/"
  schema:       "http://schema.org/"
  dct:          "http://purl.org/dc/terms/"
  skos:         "http://www.w3.org/2004/02/skos/core#"
  rdfs:         "http://www.w3.org/2000/01/rdf-schema#"
  xsd:          "http://www.w3.org/2001/XMLSchema#"
  nist_csf_v2:  "https://w3id.org/lmodel/nist-csf-v2/"
  iso27001:     "https://w3id.org/lmodel/iso27001/"
  WIKIDATA:     "https://www.wikidata.org/wiki/"

default_prefix: cis_controls
default_range: string

imports:
  - linkml:types

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
types:
  ControlId:
    uri: xsd:string
    base: str
    description: >-
      Identifier for a CIS Control (e.g. "1", "18").
    pattern: "^([1-9]|1[0-8])$"

  SafeguardId:
    uri: xsd:string
    base: str
    description: >-
      Identifier for a CIS Safeguard in the form <control>.<safeguard>
      (e.g. "1.1", "16.14").
    pattern: "^([1-9]|1[0-8])\\.[0-9]+$"

# ---------------------------------------------------------------------------
# Subsets
# ---------------------------------------------------------------------------
subsets:
  essential_cyber_hygiene:
    description: >-
      Profile containing Safeguards where implementation_groups includes IG1.
      The minimum set every enterprise should implement ("Essential Cyber Hygiene").
      56 safeguards across all 18 Controls.

  ig2_controls:
    description: >-
      Profile containing Safeguards where implementation_groups includes IG2
      (a superset of essential_cyber_hygiene). For organizations managing sensitive
      data with dedicated security staff.

  ig3_controls:
    description: >-
      Profile containing Safeguards where implementation_groups includes IG3
      (a superset of ig2_controls). For high-risk profiles with specialist security
      expertise. All 153 safeguards across 18 Controls.

# ---------------------------------------------------------------------------
# Enumerations
# ---------------------------------------------------------------------------
enums:
  ImplementationGroup:
    description: >-
      Self-assessed tier of CIS Controls applicability based on an enterprise's
      risk profile and resources. Each IG is cumulative — IG2 includes IG1,
      IG3 includes both. Introduced in CIS Controls v7.1 as the recommended
      way to prioritize implementation.
    permissible_values:
      IG1:
        description: >-
          Small to medium-sized enterprise with limited IT and cybersecurity expertise
          to dedicate toward protecting IT assets and personnel. The principal concern
          is to keep the business operational; limited tolerance for downtime; data
          sensitivity is low, principally surrounding employee and financial information.
          Safeguards should be implementable with limited cybersecurity expertise and
          designed to thwart general, non-targeted attacks using COTS hardware and
          software. Also called "Essential Cyber Hygiene."
      IG2:
        description: >-
          Enterprise employing individuals responsible for managing and protecting IT
          infrastructure. Supports multiple departments with differing risk profiles
          based on job function and mission; may have regulatory compliance burdens;
          often stores and processes sensitive client or enterprise information and can
          withstand short interruptions of service. A major concern is loss of public
          confidence if a breach occurs. Safeguards help security teams cope with
          increased operational complexity; some depend on enterprise-grade technology
          and specialized expertise to properly install and configure. Includes all IG1
          safeguards.
      IG3:
        description: >-
          Enterprise employing security experts that specialize in the different facets
          of cybersecurity (e.g., risk management, penetration testing, application
          security). Assets and data contain sensitive information or functions subject
          to regulatory and compliance oversight; must address availability of services
          and the confidentiality and integrity of sensitive data; successful attacks
          can cause significant harm to the public welfare. Safeguards must abate
          targeted attacks from a sophisticated adversary and reduce the impact of
          zero-day attacks. Includes all IG1 and IG2 safeguards.

  AssetType:
    description: >-
      The category of enterprise asset primarily addressed by a Safeguard.
      Aligned with the CIS Controls Asset Classes taxonomy (v8.1, pg. 8).
      Sub-classes exist within each category but Safeguards reference the
      top-level class only.
    permissible_values:
      Devices:
        description: >-
          Enterprise assets (data processing and storage assets), end-user devices
          (including portable and mobile devices), servers, Internet of Things (IoT)
          and non-computing devices, network devices, and removable media. Devices
          may exist in physical, virtual, or cloud-based environments and can
          remotely connect to these systems.
      Software:
        description: >-
          Sets of data and instructions used to direct a computer to complete a
          specific task. Includes applications, operating systems (with their
          services, libraries, and APIs), and firmware. Both applications and
          operating systems are considered software assets.
      Data:
        description: >-
          A collection of facts that can be examined, considered, and used for
          decision-making. Although data may be physical, the CIS Controls primarily
          provide protection for digital data stored, transferred, and processed by
          enterprise assets. Sub-classes: sensitive data, log data, and physical data.
      Users:
        description: >-
          Employees, third-party vendors, contractors, service providers, consultants,
          or any other person authorized to access an enterprise asset. Includes
          workforce, service providers, and user/administrator/service accounts.
      Network:
        description: >-
          A group of interconnected devices that exchange data. A superset of network
          infrastructure (hardware and software providing connectivity and
          communication) and network architecture (the logical and physical design
          of the network).
      Documentation:
        description: >-
          Policies, processes, procedures, plans, diagrams, and other written
          material (physical or digital), such as compliance reports. Examples include
          methods of governance for an enterprise, processes users follow, or
          descriptions of network architecture. Sub-classes: plans, policies,
          processes, and procedures.

  SecurityFunction:
    description: >-
      NIST Cybersecurity Framework 2.0 security function category to which a
      Safeguard is primarily mapped. Values correspond exactly to the six CSF 2.0
      Functions; enum as a whole is a close match for nist_csf_v2:CSFFunction.
    close_mappings: [nist_csf_v2:CSFFunction]
    permissible_values:
      Govern:
        description: >-
          Establish and monitor the organization's cybersecurity risk management
          strategy, expectations, and policy.
        meaning: nist_csf_v2:GV
      Identify:
        description: >-
          Develop an organizational understanding of cybersecurity risk to systems,
          people, assets, data, and capabilities.
        meaning: nist_csf_v2:ID
      Protect:
        description: >-
          Develop and implement appropriate safeguards to ensure delivery of
          critical services.
        meaning: nist_csf_v2:PR
      Detect:
        description: >-
          Develop and implement appropriate activities to identify the occurrence
          of a cybersecurity event.
        meaning: nist_csf_v2:DE
      Respond:
        description: >-
          Develop and implement appropriate activities to take action regarding a
          detected cybersecurity incident.
        meaning: nist_csf_v2:RS
      Recover:
        description: >-
          Develop and implement appropriate activities to maintain plans for
          resilience and to restore capabilities impaired by a cybersecurity incident.
        meaning: nist_csf_v2:RC

# ---------------------------------------------------------------------------
# Slots
# ---------------------------------------------------------------------------
slots:
  id:
    identifier: true
    range: string
    required: true
    slot_uri: dct:identifier
    description: Unique identifier for the element.
    exact_mappings: [nist_csf_v2:id]

  title:
    range: string
    required: true
    slot_uri: dct:title
    description: Human-readable title of the element.
    exact_mappings: [nist_csf_v2:title]

  description:
    range: string
    slot_uri: dct:description
    description: Descriptive text for the element.
    close_mappings: [nist_csf_v2:prose]

  overview:
    range: string
    description: >-
      Brief description of the intent of a Control and its utility as a
      defensive action.
    close_mappings: [nist_csf_v2:prose]

  why_critical:
    range: string
    description: >-
      Explanation of the importance of this Control in blocking, mitigating, or
      identifying attacks, and how attackers exploit its absence.

  procedures_and_tools:
    range: string
    description: >-
      Technical description of the processes and technologies that enable
      implementation and automation of this Control.

  control_number:
    range: ControlId
    required: true
    description: Numeric identifier of the parent CIS Control (1–18).

  safeguard_number:
    range: SafeguardId
    required: true
    description: >-
      Dotted identifier of this Safeguard (e.g. "1.1"). Combines the parent
      control number with a sequential Safeguard index.

  asset_type:
    range: AssetType
    required: true
    description: >-
      The class of enterprise asset primarily addressed by this Safeguard.

  security_function:
    range: SecurityFunction
    required: true
    description: >-
      NIST CSF 2.0 function category to which this Safeguard is mapped.
    close_mappings: [nist_csf_v2:groups]

  implementation_groups:
    range: ImplementationGroup
    multivalued: true
    required: true
    description: >-
      The Implementation Group(s) for which this Safeguard is applicable.
      IG2 implies IG1; IG3 implies IG1 and IG2.
    related_mappings: [nist_csf_v2:props]

  safeguards:
    range: Safeguard
    multivalued: true
    inlined_as_list: true
    description: List of Safeguards belonging to a CIS Control.
    close_mappings: [nist_csf_v2:controls]

  controls:
    range: CISControl
    multivalued: true
    inlined_as_list: true
    description: List of CIS Controls in this document.
    close_mappings: [nist_csf_v2:groups]

  version:
    range: string
    description: Version string of the CIS Controls document (e.g. "8.1").
    slot_uri: dct:hasVersion
    exact_mappings: [nist_csf_v2:version]

  publication_date:
    range: string
    description: Publication date of the CIS Controls document (ISO 8601).
    slot_uri: dct:date

# ---------------------------------------------------------------------------
# Classes
# ---------------------------------------------------------------------------
classes:

  CISControlsDocument:
    tree_root: true
    description: >-
      Root container for a versioned edition of the CIS Critical Security
      Controls publication.
    slots:
      - id
      - title
      - description
      - version
      - publication_date
      - controls
    id_prefixes: [cis_controls]
    exact_mappings: [schema:CreativeWork]
    close_mappings: [nist_csf_v2:CSFDocument]
    related_mappings: [iso27001:InformationSecurityManagementSystem]
    see_also: [https://www.cisecurity.org/controls/]

  CISControl:
    description: >-
      One of the 18 CIS Critical Security Controls — a high-level defensive
      action category that enterprises should implement to reduce cyber risk.
    slots:
      - id
      - title
      - control_number
      - overview
      - why_critical
      - procedures_and_tools
      - safeguards
    slot_usage:
      id:
        description: >-
          Composite identifier for the control (e.g. "CIS-1").
        pattern: "^CIS-([1-9]|1[0-8])$"
    id_prefixes: [cis_controls]
    exact_mappings: [schema:Action]
    close_mappings: [nist_csf_v2:CSFCategory]
    related_mappings: [WIKIDATA:Q2695280]
    see_also: [https://www.cisecurity.org/controls/]

  Safeguard:
    description: >-
      A specific, measurable action that an enterprise should take to implement
      a CIS Control. Formerly called "Sub-Controls" prior to CIS Controls v8.
    slots:
      - id
      - title
      - safeguard_number
      - description
      - asset_type
      - security_function
      - implementation_groups
    slot_usage:
      id:
        description: >-
          Composite identifier for the safeguard (e.g. "CIS-1.1").
        pattern: "^CIS-([1-9]|1[0-8])\\.[0-9]+$"
      implementation_groups:
        description: >-
          Implementation Group(s) for which this Safeguard is applicable.
          A Safeguard listed under IG2 is also required for IG3 enterprises;
          a Safeguard listed under IG1 is required for all enterprises.
    in_subset:
      - essential_cyber_hygiene
      - ig2_controls
      - ig3_controls
    id_prefixes: [cis_controls]
    aliases:
      - sub-control
    exact_mappings: [schema:Action]
    close_mappings: [nist_csf_v2:CSFSubcategory]
    related_mappings: [iso27001:SecurityControl]
    see_also: [https://www.cisecurity.org/controls/]
