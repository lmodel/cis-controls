enums:
  CisImplementationGroup:
    name: CisImplementationGroup
    definition_uri: https://w3id.org/lmodel/cis-controls/CisImplementationGroup
    description: One of the three Implementation Groups, CIS's tiers for deciding
      which Safeguards an enterprise puts in place first. Each group includes every
      Safeguard of the groups before it.
    from_schema: https://w3id.org/lmodel/cis-controls
    see_also:
    - https://www.cisecurity.org/controls/implementation-groups
    permissible_values:
      IG1:
        text: IG1
        description: The first group, where every enterprise starts.
        title: Implementation Group 1
      IG2:
        text: IG2
        description: The second group, which adds Safeguards to the first.
        title: Implementation Group 2
      IG3:
        text: IG3
        description: The third group, which adds the rest and so holds every Safeguard.
        title: Implementation Group 3
  CisAssetClass:
    name: CisAssetClass
    definition_uri: https://w3id.org/lmodel/cis-controls/CisAssetClass
    description: One of the classes of enterprise asset that the CIS Controls sort
      their Safeguards by. Each Safeguard is about one class.
    comments:
    - CIS revised the classes, and which Safeguard is about which, in Version 8.1.
      CIS's guide divides each class further, but a Safeguard names only the class.
    from_schema: https://w3id.org/lmodel/cis-controls
    see_also:
    - https://www.cisecurity.org/insights/white-papers/guide-to-asset-classes-cis-critical-security-controls-v8-1
    permissible_values:
      DEVICES:
        text: DEVICES
        description: The enterprise's hardware, wherever it runs.
        title: Devices
      SOFTWARE:
        text: SOFTWARE
        description: The programs and systems that run on the enterprise's devices.
        title: Software
      DATA:
        text: DATA
        description: The information the enterprise holds, uses and moves.
        title: Data
      USERS:
        text: USERS
        description: The people and accounts with access to the enterprise's assets.
        title: Users
      NETWORK:
        text: NETWORK
        description: How the enterprise's devices connect, and how its networks are
          laid out.
        title: Network
      DOCUMENTATION:
        text: DOCUMENTATION
        description: The enterprise's written governance, such as its policies and
          procedures.
        title: Documentation
  CisSecurityFunction:
    name: CisSecurityFunction
    definition_uri: https://w3id.org/lmodel/cis-controls/CisSecurityFunction
    description: The security function a Safeguard serves. The values are the six
      functions of the NIST Cybersecurity Framework (CSF) 2.0, to which Version 8.1
      aligned the CIS Controls.
    comments:
    - lmodel/nist-csf-v2 v0.1.0 models a CSF function as an instance of its class
      CsfFunction, IRI nist_csf_v2:Function, named by the two letters in its csf_function_id.
      It publishes no IRI for each function, so the values carry no meaning; each
      value's csf_function_id annotation gives the letters, and the enum names the
      class in related_mappings.
    from_schema: https://w3id.org/lmodel/cis-controls
    see_also:
    - https://www.cisecurity.org/controls/v8-1
    related_mappings:
    - nist_csf_v2:Function
    permissible_values:
      GOVERN:
        text: GOVERN
        description: The CSF 2.0 function GOVERN.
        annotations:
          csf_function_id:
            tag: csf_function_id
            value: GV
        title: Govern
      IDENTIFY:
        text: IDENTIFY
        description: The CSF 2.0 function IDENTIFY.
        annotations:
          csf_function_id:
            tag: csf_function_id
            value: ID
        title: Identify
      PROTECT:
        text: PROTECT
        description: The CSF 2.0 function PROTECT.
        annotations:
          csf_function_id:
            tag: csf_function_id
            value: PR
        title: Protect
      DETECT:
        text: DETECT
        description: The CSF 2.0 function DETECT.
        annotations:
          csf_function_id:
            tag: csf_function_id
            value: DE
        title: Detect
      RESPOND:
        text: RESPOND
        description: The CSF 2.0 function RESPOND.
        annotations:
          csf_function_id:
            tag: csf_function_id
            value: RS
        title: Respond
      RECOVER:
        text: RECOVER
        description: The CSF 2.0 function RECOVER.
        annotations:
          csf_function_id:
            tag: csf_function_id
            value: RC
        title: Recover
slots:
  cis_control_id:
    name: cis_control_id
    definition_uri: https://w3id.org/lmodel/cis-controls/cis_control_id
    description: The Control's identifier, its number, such as 4.
    comments:
    - 'The identifier is CIS''s own number, so data joins with CIS''s guide and with
      the crosswalks that cite it without a translation. It is a string, so quote
      it in YAML: YAML reads an unquoted 4 as a number and an unquoted 1.10 as the
      number 1.1. The validator rejects either as not a string, but a file loaded
      into the generated dataclasses without validation would turn 1.10 into 1.1.'
    from_schema: https://w3id.org/lmodel/cis-controls
    slot_uri: cis_controls:cis_control_id
    owner: CisControl
    domain_of:
    - CisControl
    range: cis_control_identifier
    required: true
  cis_safeguard_id:
    name: cis_safeguard_id
    definition_uri: https://w3id.org/lmodel/cis-controls/cis_safeguard_id
    description: The Safeguard's identifier, its number, such as 4.1.
    comments:
    - It starts with the number of the Control that holds the Safeguard. The validator
      cannot check that against the Control a Safeguard is listed under; tests/test_data.py
      checks it over the examples.
    from_schema: https://w3id.org/lmodel/cis-controls
    slot_uri: cis_controls:cis_safeguard_id
    owner: CisSafeguard
    domain_of:
    - CisSafeguard
    range: cis_safeguard_identifier
    required: true
  title:
    name: title
    definition_uri: https://w3id.org/lmodel/cis-controls/title
    description: A name for the Control or Safeguard, in words its user has the right
      to use.
    comments:
    - It means what LOKF's title means and carries the same IRI, so lokf adapt folds
      it into LOKF's slot and a knowledge bundle reads one title key.
    - CIS's own names for the Controls and Safeguards are CIS's text under CC BY-NC-ND
      4.0, so the schema's examples leave them out.
    from_schema: https://w3id.org/lmodel/cis-controls
    mappings:
    - schema:name
    slot_uri: schema:name
    owner: CisSafeguard
    domain_of:
    - CisControl
    - CisSafeguard
    range: string
  description:
    name: description
    definition_uri: https://w3id.org/lmodel/cis-controls/description
    description: What the Control or Safeguard means to its user, in words its user
      has the right to use.
    comments:
    - It means what LOKF's description means and carries the same IRI, so lokf adapt
      folds it into LOKF's slot and a knowledge bundle reads one description key.
    from_schema: https://w3id.org/lmodel/cis-controls
    mappings:
    - schema:description
    slot_uri: schema:description
    owner: CisSafeguard
    domain_of:
    - CisControl
    - CisSafeguard
    range: string
  cisControls__cis_version:
    name: cisControls__cis_version
    description: The edition, as CIS numbers it, such as 8.1, or the revision the
      guide's pages carry, such as 8.1.2.
    from_schema: https://w3id.org/lmodel/cis-controls
    slot_uri: cis_controls:cis_version
    alias: cis_version
    owner: CisControls
    domain_of:
    - CisControls
    range: string
    required: true
    pattern: ^[0-9]+\.[0-9]+(\.[0-9]+)?$
  cisControls__cis_controls:
    name: cisControls__cis_controls
    description: The Controls, in CIS's order.
    from_schema: https://w3id.org/lmodel/cis-controls
    slot_uri: cis_controls:cis_controls
    alias: cis_controls
    owner: CisControls
    domain_of:
    - CisControls
    range: CisControl
    required: true
    multivalued: true
    inlined: true
    inlined_as_list: true
    minimum_cardinality: 1
  cisControl__control_safeguards:
    name: cisControl__control_safeguards
    description: The Safeguards of the Control. A knowledge bundle relates a Safeguard
      to its Control with isPartOf instead.
    from_schema: https://w3id.org/lmodel/cis-controls
    slot_uri: cis_controls:control_safeguards
    alias: control_safeguards
    owner: CisControl
    domain_of:
    - CisControl
    range: CisSafeguard
    multivalued: true
    inlined: true
    inlined_as_list: true
  cisSafeguard__safeguard_asset_class:
    name: cisSafeguard__safeguard_asset_class
    description: The class of enterprise asset the Safeguard is about.
    from_schema: https://w3id.org/lmodel/cis-controls
    slot_uri: cis_controls:safeguard_asset_class
    alias: safeguard_asset_class
    owner: CisSafeguard
    domain_of:
    - CisSafeguard
    range: CisAssetClass
    required: true
  cisSafeguard__safeguard_security_function:
    name: cisSafeguard__safeguard_security_function
    description: The security function the Safeguard serves, one of the six functions
      of the NIST Cybersecurity Framework (CSF) 2.0.
    from_schema: https://w3id.org/lmodel/cis-controls
    slot_uri: cis_controls:safeguard_security_function
    alias: safeguard_security_function
    owner: CisSafeguard
    domain_of:
    - CisSafeguard
    range: CisSecurityFunction
    required: true
  cisSafeguard__safeguard_implementation_groups:
    name: cisSafeguard__safeguard_implementation_groups
    description: The Implementation Groups that include the Safeguard.
    comments:
    - 'The groups are cumulative: a Safeguard in IG1 is in IG2 and IG3 too, and one
      in IG2 is in IG3. The schema states the part of that rule the validator can
      check, that every Safeguard is in IG3. It cannot state the rest in a form the
      JSON Schema that LinkML 1.12.1 generates enforces, so a list of IG1 and IG3
      without IG2 passes the validator; tests/test_data.py checks the whole rule over
      the examples.'
    from_schema: https://w3id.org/lmodel/cis-controls
    slot_uri: cis_controls:safeguard_implementation_groups
    alias: safeguard_implementation_groups
    owner: CisSafeguard
    domain_of:
    - CisSafeguard
    range: CisImplementationGroup
    required: true
    multivalued: true
    minimum_cardinality: 1
    maximum_cardinality: 3
    has_member:
      equals_string: IG3
classes:
  CisControls:
    name: CisControls
    definition_uri: https://w3id.org/lmodel/cis-controls/CisControls
    description: 'One edition of the CIS Controls as a whole: its Controls, each holding
      its Safeguards.'
    from_schema: https://w3id.org/lmodel/cis-controls
    see_also:
    - https://www.cisecurity.org/controls/cis-controls-list
    exact_mappings:
    - cis_controls:Controls
    broad_mappings:
    - oscal:Catalog
    slots:
    - cisControls__cis_version
    - cisControls__cis_controls
    attributes:
      cis_version:
        name: cis_version
        description: The edition, as CIS numbers it, such as 8.1, or the revision
          the guide's pages carry, such as 8.1.2.
        required: true
        pattern: ^[0-9]+\.[0-9]+(\.[0-9]+)?$
      cis_controls:
        name: cis_controls
        description: The Controls, in CIS's order.
        range: CisControl
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
        minimum_cardinality: 1
    class_uri: cis_controls:Controls
    tree_root: true
  CisControl:
    name: CisControl
    definition_uri: https://w3id.org/lmodel/cis-controls/CisControl
    description: 'One of the CIS Controls: a group of Safeguards on one subject, named
      by its number, such as Control 4.'
    from_schema: https://w3id.org/lmodel/cis-controls
    see_also:
    - https://www.cisecurity.org/controls/cis-controls-list
    exact_mappings:
    - cis_controls:Control
    broad_mappings:
    - oscal:Group
    slots:
    - cis_control_id
    - title
    - description
    - cisControl__control_safeguards
    attributes:
      control_safeguards:
        name: control_safeguards
        description: The Safeguards of the Control. A knowledge bundle relates a Safeguard
          to its Control with isPartOf instead.
        range: CisSafeguard
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: cis_controls:Control
  CisSafeguard:
    name: CisSafeguard
    definition_uri: https://w3id.org/lmodel/cis-controls/CisSafeguard
    description: 'One Safeguard of a Control: a single action an enterprise takes,
      named by its Control''s number and its own, such as Safeguard 4.1.'
    from_schema: https://w3id.org/lmodel/cis-controls
    see_also:
    - https://www.cisecurity.org/controls/cis-controls-list
    exact_mappings:
    - cis_controls:Safeguard
    broad_mappings:
    - oscal:Control
    slots:
    - cis_safeguard_id
    - title
    - description
    - cisSafeguard__safeguard_asset_class
    - cisSafeguard__safeguard_security_function
    - cisSafeguard__safeguard_implementation_groups
    attributes:
      safeguard_asset_class:
        name: safeguard_asset_class
        description: The class of enterprise asset the Safeguard is about.
        range: CisAssetClass
        required: true
      safeguard_security_function:
        name: safeguard_security_function
        description: The security function the Safeguard serves, one of the six functions
          of the NIST Cybersecurity Framework (CSF) 2.0.
        range: CisSecurityFunction
        required: true
      safeguard_implementation_groups:
        name: safeguard_implementation_groups
        description: The Implementation Groups that include the Safeguard.
        comments:
        - 'The groups are cumulative: a Safeguard in IG1 is in IG2 and IG3 too, and
          one in IG2 is in IG3. The schema states the part of that rule the validator
          can check, that every Safeguard is in IG3. It cannot state the rest in a
          form the JSON Schema that LinkML 1.12.1 generates enforces, so a list of
          IG1 and IG3 without IG2 passes the validator; tests/test_data.py checks
          the whole rule over the examples.'
        range: CisImplementationGroup
        required: true
        multivalued: true
        minimum_cardinality: 1
        maximum_cardinality: 3
        has_member:
          equals_string: IG3
    class_uri: cis_controls:Safeguard
