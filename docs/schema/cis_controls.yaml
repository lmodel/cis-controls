name: cis_controls
annotations:
  cis_site_version:
    tag: cis_site_version
    value: '8.1'
  revision_date:
    tag: revision_date
    value: 2025-03
  pages_read_on:
    tag: pages_read_on
    value: '2026-10-30'
description: 'A LinkML model of the structure of the CIS Critical Security Controls
  (CIS Controls), Version 8.1, which the Center for Internet Security (CIS) publishes:
  its Controls, the Safeguards of each Control, and for each Safeguard its asset class,
  its security function and the Implementation Groups that include it. It names each
  Control and Safeguard by its number and carries none of CIS''s text.'
title: CIS Critical Security Controls
comments:
- The version is the label that the pages of CIS's guide carry for its revision of
  March 2025. CIS's site calls the edition Version 8.1, and the guide's change log
  names two minor revisions of it, v8.1.1 in August 2024 and v8.1.2 in March 2025,
  which corrected small errors, among them the security function of two Safeguards.
  The source is CIS's page for Version 8.1. scripts/check_upstream_release.py holds
  the same pins and reports when CIS's pages name a newer version.
- 'CIS licenses the CIS Controls under CC BY-NC-ND 4.0 and requires its prior approval
  for commercial use, while this schema is Apache-2.0. So the schema carries no CIS
  text: no Control or Safeguard title or description, and none of the guide''s overviews
  or explanations. The descriptions here are this project''s own words. The text slots,
  title and description, are optional and hold text their user has the right to use;
  NOTICE says what CIS''s licence allows.'
- The edition holds 18 Controls and 153 Safeguards. Implementation Group 1 holds 56
  of the Safeguards, Implementation Group 2 adds 74 to make 130, and Implementation
  Group 3 adds the last 23, so it holds all 153. CIS's pages on the CIS Controls list
  and on each Implementation Group state these numbers.
source: https://www.cisecurity.org/controls/v8-1
see_also:
- https://lmodel.github.io/cis-controls
- https://www.cisecurity.org/controls/cis-controls-list
- https://www.cisecurity.org/controls/implementation-groups
- https://www.cisecurity.org/insights/white-papers/guide-to-asset-classes-cis-critical-security-controls-v8-1
